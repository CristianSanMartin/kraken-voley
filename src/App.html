<script>
/* ====================================================================
   Kraken Vóley — lógica de la web
   ==================================================================== */
var S = { boot: null, view: 'inicio', mes: null, cache: {} };

/* ---------- utilidades ---------- */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok) resolve(res.data); else reject(new Error(res ? res.error : 'Sin respuesta')); })
      .withFailureHandler(function (e) { reject(e); });
    r[fn].apply(r, args);
  });
}
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { if (n == null || n === '') return '—'; n = Number(n) || 0; return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('es-CL'); }
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function mesLabel(m, corto) { if (!m) return ''; var p = m.split('-'); var n = MESES[Number(p[1]) - 1]; return corto ? MES3[Number(p[1]) - 1] + ' ' + p[0].slice(2) : n.charAt(0).toUpperCase() + n.slice(1) + ' ' + p[0]; }
function mesMas(m, k) { var p = m.split('-'); var d = new Date(Number(p[0]), Number(p[1]) - 1 + k, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function fecha(f) { if (!f) return '—'; var p = String(f).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : f; }
function fechaCorta(f) { if (!f) return ''; var p = String(f).slice(0, 10).split('-'); return Number(p[2]) + ' ' + MES3[Number(p[1]) - 1]; }
function edad(fn) { if (!fn) return ''; var h = new Date(S.boot.hoy), n = new Date(String(fn).slice(0, 10)); var e = h.getFullYear() - n.getFullYear(); if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) e--; return e; }
function iniciales(n) { return String(n || '?').split(/\s+/).slice(0, 2).map(function (x) { return x.charAt(0); }).join('').toUpperCase(); }
function $(s) { return document.querySelector(s); }
function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function toast(msg, err) { var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 5000 : 2600); }
function fallo(e) { console.error(e); toast('Error: ' + (e && e.message || e), true); }
function cargando(el) { (el || $('#main')).innerHTML = '<div class="loading"><div class="spin"></div>Cargando…</div>'; }
function ultimoSabado(hoy) { var d = new Date(hoy + 'T12:00:00'); while (d.getDay() !== 6) d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }

var ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 5.4"/>',
  cash: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  check: '<rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9h17M8 2.5v4M16 2.5v4M8.5 14.5l2.3 2.3 4.7-4.6"/>',
  box: '<path d="M4 7h16v13H4zM2.5 3.5h19V7h-19zM9.5 11h5"/>',
  trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 20.5h8M9.5 17h5v3.5h-5z"/>',
  inbox: '<path d="M3 13l2.6-7.4A1.5 1.5 0 0 1 7 4.6h10a1.5 1.5 0 0 1 1.4 1l2.6 7.4v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  wa: '<path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.3A8.5 8.5 0 1 1 20.5 11.6z"/><path d="M9 8.5c0 3.5 2.6 6.4 6 6.6l1.2-1.4-1.9-1-1 .8a4.6 4.6 0 0 1-2.4-2.4l.8-1-1-1.9z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>',
  down: '<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'
};
function ic(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICON[n] + '</svg>'; }

/* ---------- navegación ---------- */
var VISTAS = [
  ['inicio', 'Inicio', 'home'], ['alumnas', 'Alumnas', 'users'], ['finanzas', 'Finanzas', 'cash'],
  ['asistencia', 'Asistencia', 'check'], ['torneos', 'Torneos', 'trophy'],
  ['sep'], ['inscripciones', 'Inscripciones', 'inbox'], ['mas', 'Más registros', 'more'], ['config', 'Configuración', 'gear']
];
function pintarNav() {
  $('#nav').innerHTML = VISTAS.map(function (v) {
    if (v[0] === 'sep') return '<div class="sep"></div>';
    var badge = v[0] === 'inscripciones' && S.nInsc ? '<span class="badge">' + S.nInsc + '</span>' : '';
    return '<a href="#" data-v="' + v[0] + '" class="' + (S.view === v[0] ? 'on' : '') + '">' + ic(v[2]) + v[1] + badge + '</a>';
  }).join('');
  $$('#nav a').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); ir(a.dataset.v); }; });
}
// Mensualidades y Caja son pestañas de Finanzas: ir('caja') abre Finanzas en esa pestaña.
var TABS_FIN = [['mensualidades', 'Mensualidades'], ['caja', 'Caja']];
function ir(v, arg) {
  if (v === 'mensualidades' || v === 'caja') { S.tfin = v; v = 'finanzas'; }
  S.view = v; pintarNav(); $('#side').classList.remove('open');
  window.scrollTo(0, 0);
  (R[v] || R.inicio)(arg);
}
function toggleSide() { $('#side').classList.toggle('open'); }
function cabecera(titulo, sub, toolbar) {
  return '<div class="top"><div><h1>' + titulo + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div><div class="toolbar">' + (toolbar || '') + '</div></div>';
}
function selectorMes(id) {
  return '<div class="row"><button class="btn sm" id="' + id + '-prev" aria-label="Mes anterior">' + ic('left') + '</button>' +
    '<b style="min-width:132px;text-align:center;font-family:Outfit,Inter,sans-serif">' + mesLabel(S.mes) + '</b>' +
    '<button class="btn sm" id="' + id + '-next" aria-label="Mes siguiente">' + ic('right') + '</button></div>';
}
function enlazarMes(id, fn) {
  $('#' + id + '-prev').onclick = function () { S.mes = mesMas(S.mes, -1); fn(); };
  $('#' + id + '-next').onclick = function () { S.mes = mesMas(S.mes, 1); fn(); };
}

/* ---------- modal ---------- */
function modal(titulo, cuerpo, botones, wide) {
  var root = $('#modal-root');
  root.innerHTML = '<div class="ov"><div class="modal' + (wide ? ' wide' : '') + '"><div class="mh"><h2>' + titulo + '</h2><button class="btn ghost sm" data-x>✕</button></div><div class="mb">' + cuerpo + '</div>' +
    (botones ? '<div class="mf">' + botones + '</div>' : '') + '</div></div>';
  root.querySelector('[data-x]').onclick = cerrarModal;
  root.querySelector('.ov').addEventListener('mousedown', function (e) { if (e.target.classList.contains('ov')) cerrarModal(); });
  return root.querySelector('.modal');
}
function cerrarModal() { $('#modal-root').innerHTML = ''; }
function ocupado(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px"></span>'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }

/* ---------- mensajes / WhatsApp ---------- */
function plantilla(clave, datos) {
  var cfg = S.boot.config, t = String(cfg[clave] || '');
  t = t.replace(/\{(Transferencia_[A-Za-z]+)\}/g, function (m, k) { return cfg[k] || ''; });
  return t.replace(/\{(\w+)\}/g, function (m, k) { return datos[k] != null ? datos[k] : ''; });
}
function telWa(t) {
  var d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 9 && d.charAt(0) === '9') d = '56' + d;
  else if (d.length === 8) d = '569' + d;
  return d;
}
function copiar(txt) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { return navigator.clipboard.writeText(txt).then(function () { toast('Mensaje copiado'); }, function () { copiarViejo(txt); }); } } catch (e) {}
  copiarViejo(txt);
}
function copiarViejo(txt) { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Mensaje copiado'); } catch (e) { toast('No se pudo copiar', true); } ta.remove(); }
function enviarWa(telefono, texto) {
  var n = telWa(telefono);
  mostrarMensaje(texto, n);
}
function mostrarMensaje(texto, n) {
  var m = modal('Mensaje para el apoderado', '<textarea class="in" id="msg-txt" rows="8" style="width:100%">' + esc(texto) + '</textarea>' +
    (n ? '' : '<p class="small muted" style="margin:8px 0 0">Esta alumna no tiene teléfono de apoderado en su ficha: copia el mensaje y pégalo en WhatsApp.</p>'),
    '<button class="btn" id="msg-copy">' + ic('copy') + 'Copiar</button>' + (n ? '<a class="btn wa" id="msg-wa" target="_blank" href="#">' + ic('wa') + 'Abrir WhatsApp</a>' : ''));
  m.querySelector('#msg-copy').onclick = function () { copiar(m.querySelector('#msg-txt').value); };
  var a = m.querySelector('#msg-wa');
  if (a) a.onclick = function () { a.href = 'https://wa.me/' + n + '?text=' + encodeURIComponent(m.querySelector('#msg-txt').value); };
}
function msgCobro(d) {
  return plantilla('Plantilla_Cobro', { apoderado: (d.apoderado || '').split(' ')[0] || '', alumna: d.alumna, mes: mesLabel(d.mes).toLowerCase(), monto: Number(d.monto || 0).toLocaleString('es-CL') }) +
    '\n\n' + plantilla('Plantilla_Datos_Transferencia', {});
}

function pillEstado(estado, atrasada) {
  if (atrasada) return '<span class="pill bad"><span class="dot"></span>Atrasada</span>';
  var c = { 'Pagado': 'ok', 'Pendiente': 'warn', 'Promete pagar': 'info', 'Becada': 'kr', 'Sin cobro': '', 'Clase de prueba': 'kr', 'Sin registro': '', 'Retirada': '' }[estado];
  return '<span class="pill ' + (c || '') + '"><span class="dot"></span>' + esc(estado || '—') + '</span>';
}

/* ====================================================================
   VISTAS
   ==================================================================== */
var R = {};

/* ---------- INICIO ---------- */
R.inicio = function () {
  cargando();
  api('api_dashboard', S.mes).then(function (d) {
    var pct = d.cobros.esperado ? Math.min(100, Math.round(d.cobros.cobrado / d.cobros.esperado * 100)) : 0;
    var grupos = Object.keys(d.grupos).sort().map(function (g) { return esc(g) + ' ' + d.grupos[g]; }).join(' · ');
    var deudasMes = d.deudas.filter(function (x) { return x.mes === d.mes; }).length;
    var max = 1; d.serie.forEach(function (s) { max = Math.max(max, s.ingresos, s.egresos); });
    var h = cabecera('Hola, Cristian 👋', 'Resumen del taller · ' + mesLabel(d.mes), selectorMes('dm'));
    if (!d.generado && d.mes >= S.boot.mes) {
      h += '<div class="note warn row" style="margin-bottom:16px"><span>Las mensualidades de <b>' + mesLabel(d.mes) + '</b> aún no están creadas.</span><button class="btn pri sm right" id="gen-mes">Crear mensualidades del mes</button></div>';
    }
    h += '<div class="grid g4">' +
      '<div class="card kpi hero"><div class="lbl">Cobrado del mes</div><div class="val">' + money(d.cobros.cobrado) + '</div><div class="foot">de ' + money(d.cobros.esperado) + ' esperado · ' + pct + '%</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="card kpi"><div class="lbl">Por cobrar</div><div class="val" style="color:' + (d.totalDeuda ? 'var(--bad)' : 'inherit') + '">' + money(d.totalDeuda) + '</div><div class="foot">' + d.deudas.length + ' mensualidades · ' + deudasMes + ' de este mes</div></div>' +
      '<div class="card kpi"><div class="lbl">Alumnas activas</div><div class="val">' + d.activas + '</div><div class="foot">' + grupos + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Tu remanente del mes</div><div class="val">' + money(d.caja.remanente) + '</div><div class="foot">Ingresos ' + money(d.caja.ingresos) + ' − gastos ' + money(d.caja.egresosSinCristian) + '</div></div>' +
      '</div>';
    h += '<div class="grid g2" style="margin-top:16px">';
    h += '<div class="card"><div class="hd"><h3>Quién debe</h3><button class="btn sm ghost" data-go="mensualidades">Ver mensualidades →</button></div>';
    if (!d.deudas.length) h += '<div class="empty">Nadie debe. 🎉</div>';
    else h += '<div class="list">' + d.deudas.slice(0, 9).map(function (x) {
      return '<div class="li"><div class="who"><span class="av">' + iniciales(x.alumna) + '</span><div style="min-width:0"><b>' + esc(x.alumna) + '</b><span class="small muted">' + mesLabel(x.mes) + (x.nota ? ' · ' + esc(x.nota) : '') + '</span></div></div>' +
        '<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="nowrap">' + money(x.monto) + '</span>' + pillEstado(x.estado, x.atrasada) + '<button class="btn sm wa" data-cobrar="' + esc(x.id) + '" title="Mensaje de cobro">' + ic('wa') + '</button></div></div>';
    }).join('') + (d.deudas.length > 9 ? '<div class="small muted" style="padding-top:8px">y ' + (d.deudas.length - 9) + ' más…</div>' : '') + '</div>';
    h += '</div>';
    h += '<div class="card"><div class="hd"><h3>Caja · últimos 12 meses</h3><div class="legend"><span><i style="background:var(--kr-500)"></i>Ingresos</span><span><i style="background:var(--kr-300)"></i>Egresos</span></div></div><div class="chart">' +
      d.serie.map(function (s) {
        return '<div class="c" title="' + mesLabel(s.mes) + ': ingresos ' + money(s.ingresos) + ' / egresos ' + money(s.egresos) + '"><div class="bars"><i class="a" style="height:' + (s.ingresos / max * 100) + '%"></i><i class="b" style="height:' + (s.egresos / max * 100) + '%"></i></div><span>' + MES3[Number(s.mes.slice(5)) - 1] + '</span></div>';
      }).join('') + '</div></div>';
    h += '</div>';
    h += '<div class="grid g3" style="margin-top:16px">';
    h += '<div class="card"><div class="hd"><h3>Alertas</h3></div><div class="list">' +
      (d.alertasAsistencia.length ? d.alertasAsistencia.map(function (a) { return '<div class="li"><span>' + esc(a.alumna) + '</span><span class="pill bad">' + a.n + ' faltas injustificadas</span></div>'; }).join('') : '<div class="li"><span class="muted">Sin alumnas sobre ' + (S.boot.config.Max_Inasistencias_Injustificadas_Mes || 3) + ' faltas injustificadas</span><span class="pill ok">OK</span></div>') +
      (d.sinRut.length ? '<div class="li"><span>' + d.sinRut.length + ' activas sin RUT / ficha</span><button class="btn sm" data-go="alumnas" data-arg="sinrut">Ver</button></div>' : '') +
      (S.nInsc ? '<div class="li"><span>' + S.nInsc + ' inscripciones nuevas</span><button class="btn sm" data-go="inscripciones">Revisar</button></div>' : '') +
      '</div></div>';
    h += '<div class="card"><div class="hd"><h3>Cumpleaños de ' + MESES[Number(d.mes.slice(5)) - 1] + '</h3></div>' +
      (d.cumpleanos.length ? '<div class="list">' + d.cumpleanos.map(function (c) { return '<div class="li"><span>🎂 ' + esc(c.alumna) + '</span><span class="muted">' + fechaCorta(c.fecha) + ' · ' + c.edad + ' años</span></div>'; }).join('') + '</div>' : '<div class="empty">Sin cumpleaños este mes</div>') + '</div>';
    h += '<div class="card"><div class="hd"><h3>Próximos partidos</h3><button class="btn sm ghost" data-go="torneos">Torneos →</button></div>' +
      (d.partidos.length ? '<div class="list">' + d.partidos.map(function (p) { return '<div class="li"><span>' + fechaCorta(p.Fecha) + ' · ' + esc(p.Serie) + '</span><span class="muted">' + esc(p.Rival || 'Rival por definir') + '</span></div>'; }).join('') + '</div>' : '<div class="empty">No hay partidos próximos cargados</div>') + '</div>';
    h += '</div>';
    if (d.sesiones.length) {
      h += '<div class="card" style="margin-top:16px"><div class="hd"><h3>Asistencia de ' + MESES[Number(d.mes.slice(5)) - 1] + '</h3><button class="btn sm ghost" data-go="asistencia">Pasar lista →</button></div><div class="row">' +
        d.sesiones.map(function (s) { return '<span class="pill kr">' + fechaCorta(s.fecha) + ': ' + s.presentes + '/' + s.total + '</span>'; }).join('') + '</div></div>';
    }
    $('#main').innerHTML = h;
    enlazarMes('dm', R.inicio);
    enlazarGo();
    var g = $('#gen-mes'); if (g) g.onclick = function () { generarMes(d.mes, g, R.inicio); };
    $$('[data-cobrar]').forEach(function (b) {
      b.onclick = function () {
        var x = d.deudas.filter(function (y) { return y.id === b.dataset.cobrar; })[0];
        cobrarA(x.idAlumna, x);
      };
    });
  }).catch(fallo);
};
function enlazarGo() { $$('[data-go]').forEach(function (b) { b.onclick = function () { ir(b.dataset.go, b.dataset.arg); }; }); }
function generarMes(mes, btn, luego) {
  ocupado(btn, true);
  api('api_generarMes', mes).then(function (r) { toast(r.creadas + ' mensualidades creadas para ' + mesLabel(mes)); luego(); }).catch(function (e) { ocupado(btn, false); fallo(e); });
}
function cobrarA(idAlumna, x) {
  obtenerAlumnas().then(function (lista) {
    var a = lista.filter(function (y) { return y.ID_Alumna === idAlumna; })[0] || {};
    enviarWa(a.Telefono_Apoderado, msgCobro({ apoderado: a.Apoderado, alumna: a.Nombre || x.alumna, mes: x.mes, monto: x.monto }));
  });
}
function obtenerAlumnas(forzar) {
  if (S.cache.alumnas && !forzar) return Promise.resolve(S.cache.alumnas);
  return api('api_alumnas').then(function (r) { S.cache.alumnas = r; return r; });
}

/* ---------- ALUMNAS ---------- */
R.alumnas = function (arg) {
  S.fa = S.fa || { estado: 'Activa', grupo: '', q: '', sinrut: false };
  if (arg === 'sinrut') { S.fa = { estado: 'Activa', grupo: '', q: '', sinrut: true }; }
  cargando();
  obtenerAlumnas(true).then(function (lista) {
    var grupos = S.boot.grupos;
    var h = cabecera('Alumnas', lista.filter(function (a) { return a.Estado === 'Activa'; }).length + ' activas · ' + lista.length + ' en total desde 2023',
      '<button class="btn" id="btn-nomina">' + ic('down') + 'Nómina torneo</button><button class="btn pri" id="btn-nueva">' + ic('plus') + 'Nueva alumna</button>');
    h += '<div class="card pad0"><div class="row" style="padding:14px 16px;border-bottom:1px solid var(--line)">' +
      '<div class="search">' + ic('search') + '<input class="in" id="fa-q" placeholder="Buscar nombre, apoderado, RUT…" value="' + esc(S.fa.q) + '"></div>' +

    var h = cabecera('Asistencia', d.registrada ? 'Lista ya registrada para este día — puedes corregirla' : 'Marca a cada alumna y guarda',
      '<input type="date" class="in" id="as-f" value="' + d.fecha + '"><button class="btn pri" id="as-save">Guardar lista</button>');
    h += '<div class="row" style="margin-bottom:14px"><span class="small muted">Últimas listas:</span>' + d.ultimasFechas.map(function (f) { return '<button class="btn sm ' + (f === d.fecha ? 'pri' : '') + '" data-fd="' + f + '">' + fechaCorta(f) + '</button>'; }).join('') + '</div>';

        var fs = d.filas.filter(function (f) { return (f.grupo || 'Sin grupo') === g; });

              '<td style="text-align:right"><div class="att" data-a="' + esc(f.idAlumna) + '">' +
              [['P', 'Presente'], ['J', 'Justificada'], ['I', 'Injustificada']].map(function (x) { return '<button class="' + x[0] + (e === x[1] ? ' on' : '') + '" data-e="' + x[1] + '" title="' + x[1] + '">' + x[0] + '</button>'; }).join('') +

          }).join('') + '</tbody></table></div></div>';
      }).join('');
      $$('.att[data-a] button[data-e]').forEach(function (b) {
        b.onclick = function () {

      });
      $$('[data-todas]').forEach(function (b) { b.onclick = function () { d.filas.forEach(function (f) { if ((f.grupo || 'Sin grupo') === b.dataset.todas && !cambios[f.idAlumna].estado) cambios[f.idAlumna].estado = 'Presente'; }); pintar(); }; });

  }).catch(fallo);

function confirmar(t) { try { return window.confirm(t); } catch (e) { return true; } }
function modalMov(m, c) {
  m = m || { Tipo: 'Egreso', Fecha: S.mes === S.boot.mes ? S.boot.hoy : S.mes + '-01' };
  var cats = { Ingreso: [], Egreso: [] };
  c.categorias.forEach(function (k) { var p = k.split('|'); if (cats[p[0]] && cats[p[0]].indexOf(p[1]) < 0) cats[p[0]].push(p[1]); });
  ['Sueldo profesora/or', 'Arriendo cancha', 'Pago Cristian (remanente)', 'Implementos y compras', 'Camisetas', 'Torneos', 'Actividades', 'Otros'].forEach(function (x) { if (cats.Egreso.indexOf(x) < 0) cats.Egreso.push(x); });
  ['Camisetas (cobro a familias)', 'Torneos (cuotas)', 'Actividades', 'Otros'].forEach(function (x) { if (cats.Ingreso.indexOf(x) < 0) cats.Ingreso.push(x); });
  var cuerpo = '<form class="form" id="f-mov" onsubmit="return false">' + campo('Tipo', 'Tipo', m.Tipo, 'select', ['Egreso', 'Ingreso']) + campo('Fecha', 'Fecha', m.Fecha ? String(m.Fecha).slice(0, 10) : '', 'date') +
    '<div class="f"><label>Categoría</label><input class="in" name="Categoria" list="dl-cat" value="' + esc(m.Categoria || '') + '"><datalist id="dl-cat"></datalist></div>' +
    '<div class="f"><label>Detalle (a quién / qué)</label><input class="in" name="Detalle" list="dl-det" value="' + esc(m.Detalle || '') + '"><datalist id="dl-det">' + c.personal.map(function (p) { return '<option value="' + esc(p.nombre) + '">' + esc(p.rol) + '</option>'; }).join('') + '</datalist></div>' +
    campo('Monto', 'Monto', m.Monto, 'number') + campo('Medio', 'Medio', m.Medio, 'select', ['Transferencia', 'Efectivo', 'Mercado Pago']) +
    campo('Referencia / nota', 'Referencia', m.Referencia, 'text', null, true) + '</form>';
  var md = modal(m.ID_Movimiento ? 'Editar movimiento' : 'Nuevo movimiento', cuerpo, '<button class="btn" data-c>Cancelar</button><button class="btn pri" id="mov-ok">Guardar</button>');

    var o = leerForm(md.querySelector('#f-mov')); if (m.ID_Movimiento) o.ID_Movimiento = m.ID_Movimiento;

  };
}

/* ====================================================================
   TABLAS: ordenar (clic en el encabezado) y filtrar (fila de filtros)
   Se aplica sola a toda tabla con encabezado, en cualquier vista o ventana.
   ==================================================================== */
var MES_N = {};
MESES.forEach(function (m, i) { MES_N[m] = i + 1; MES_N[m.slice(0, 3)] = i + 1; });
MES_N.sept = 9;
function valorOrden(txt) {
  var t = String(txt || '').trim();
  if (!t || t === '—' || t === '-') return null;
  var m;
  if ((m = t.match(/^(-)?\$\s?([\d.]+)/))) return Number(m[2].replace(/\./g, '')) * (m[1] ? -1 : 1);       // $16.000
  if ((m = t.match(/^(\d{2})-(\d{2})-(\d{4})/))) return Number(m[3] + m[2] + m[1]);                       // 24-10-2026
  if ((m = t.match(/^(\d{1,2}) ([a-z]{3,4})\b/i)) && MES_N[m[2].toLowerCase()]) return MES_N[m[2].toLowerCase()] * 100 + Number(m[1]); // 24 oct
  if ((m = t.match(/^([a-záéíóú]+)\s+(\d{2,4})\b/i)) && MES_N[norm(m[1])]) { var y = Number(m[2]); if (y < 100) y += 2000; return y * 100 + MES_N[norm(m[1])]; } // Octubre 2026 / oct 26
  if (/^-?\d+([.,]\d+)?$/.test(t)) return Number(t.replace(',', '.'));
  if ((m = t.match(/^#?(\d+)\b/)) && t.length < 6) return Number(m[1]);
  return norm(t);
}
function textoCelda(td) { return td ? (td.dataset.v != null ? td.dataset.v : td.textContent) : ''; }

function mejorarTabla(tabla) {
  var thead = tabla.tHead, tbody = tabla.tBodies[0];
  if (!thead || !tbody || !thead.rows.length) return;
  var ths = Array.prototype.slice.call(thead.rows[0].cells);
  // el orden y los filtros se recuerdan aunque la vista se vuelva a dibujar (ej. después de registrar un pago)
  S.tst = S.tst || {};
  var clave = (tabla.closest('#modal-root') ? 'modal:' : 'vista:') + S.view + '|' + (tabla.dataset.k || '') + '|' + ths.map(function (t) { return t.textContent.trim(); }).join(',');
  var st = tabla._st || (tabla._st = S.tst[clave] || (S.tst[clave] = { col: null, dir: 1, f: {} }));
  if (!tabla._listo) {
    tabla._listo = true;
    ths.forEach(function (th, i) {
      if (!th.textContent.trim()) return;
      th.classList.add('ord');
      th.insertAdjacentHTML('beforeend', '<span class="flecha"></span><button type="button" class="fbtn" title="Ordenar y filtrar" aria-label="Ordenar y filtrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>');
      th.onclick = function (e) {
        if (e.target.closest('.fbtn')) { e.stopPropagation(); abrirMenuFiltro(tabla, i, th.querySelector('.fbtn')); return; }
        if (st.col === i) st.dir = -st.dir; else { st.col = i; st.dir = 1; }
        aplicarTabla(tabla);
      };
    });
    var info = document.createElement('div'); info.className = 'tbl-info'; info.hidden = true;
    var wrap = tabla.closest('.tbl-wrap') || tabla;
    wrap.parentNode.insertBefore(info, wrap.nextSibling);
    tabla._info = info;
    var obs = new MutationObserver(function () { if (!tabla._aplicando) aplicarTabla(tabla); });
    obs.observe(tbody, { childList: true });
  }
  aplicarTabla(tabla);
}

function filasDatos(tbody) {
  return Array.prototype.slice.call(tbody.rows).filter(function (tr) { return !(tr.cells.length === 1 && tr.cells[0].colSpan > 1); });
}
var VACIAS = '(Vacías)';
function valorCelda(tr, i) { var v = (textoCelda(tr.cells[i]) || '').trim().replace(/\s+/g, ' '); return v && v !== '—' ? v : VACIAS; }
function pasaFiltros(tr, f, excepto) {
  return Object.keys(f).every(function (i) {
    if (String(i) === String(excepto) || !f[i]) return true;
    return f[i].indexOf(valorCelda(tr, i)) >= 0;
  });
}
function compararValores(a, b) {
  if (a === VACIAS) return 1; if (b === VACIAS) return -1;
  var x = valorOrden(a), y = valorOrden(b);
  return (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true });
}

/* ---------- menú de filtro tipo Excel ---------- */
function cerrarMenuFiltro() {
  var m = document.getElementById('fmenu'); if (m) m.remove();
  document.removeEventListener('mousedown', clicFueraMenu, true);
  document.removeEventListener('keydown', escMenu, true);
}
function clicFueraMenu(e) { var m = document.getElementById('fmenu'); if (m && !m.contains(e.target) && !e.target.closest('.fbtn')) cerrarMenuFiltro(); }
function escMenu(e) { if (e.key === 'Escape') cerrarMenuFiltro(); }

function abrirMenuFiltro(tabla, i, boton) {
  var abierto = document.getElementById('fmenu');
  if (abierto && abierto._tabla === tabla && abierto._col === i) { cerrarMenuFiltro(); return; }
  cerrarMenuFiltro();
  var st = tabla._st;
  var filas = filasDatos(tabla.tBodies[0]);
  // valores posibles: los de las filas que pasan los OTROS filtros (como Excel)
  var vals = {};
  filas.forEach(function (tr) { if (pasaFiltros(tr, st.f, i)) vals[valorCelda(tr, i)] = 1; });
  if (st.f[i]) st.f[i].forEach(function (v) { vals[v] = 1; });
  var lista = Object.keys(vals).sort(compararValores);
  var marcados = {};
  lista.forEach(function (v) { marcados[v] = !st.f[i] || st.f[i].indexOf(v) >= 0; });

  var m = document.createElement('div');
  m.id = 'fmenu'; m.className = 'fmenu'; m._tabla = tabla; m._col = i;
  m.innerHTML =
    '<button type="button" class="fm-ord" data-d="1">▲ Ordenar ascendente</button>' +
    '<button type="button" class="fm-ord" data-d="-1">▼ Ordenar descendente</button>' +
    '<div class="fm-sep"></div>' +
    '<input class="in fm-q" placeholder="Buscar…" aria-label="Buscar valores">' +
    '<label class="fm-all"><input type="checkbox"> <b>(Seleccionar todo)</b></label>' +
    '<div class="fm-list"></div>' +
    '<div class="fm-pie"><button type="button" class="btn sm" data-limpiar>Limpiar filtro</button><button type="button" class="btn sm pri" data-aplicar>Aplicar</button></div>';
  document.body.appendChild(m);

  var q = m.querySelector('.fm-q'), cont = m.querySelector('.fm-list'), todo = m.querySelector('.fm-all input');
  function visibles() { var t = norm(q.value); return lista.filter(function (v) { return !t || norm(v).indexOf(t) >= 0; }); }
  function pintar() {
    var vs = visibles();
    cont.innerHTML = vs.length ? vs.map(function (v, k) {
      return '<label><input type="checkbox" data-k="' + k + '"' + (marcados[v] ? ' checked' : '') + '> <span>' + esc(v) + '</span></label>';
    }).join('') : '<div class="muted small" style="padding:6px 4px">Sin coincidencias</div>';
    cont.querySelectorAll('input').forEach(function (c) { c.onchange = function () { marcados[vs[Number(c.dataset.k)]] = c.checked; sincTodo(); }; });
    sincTodo();
  }
  function sincTodo() {
    var vs = visibles(), n = vs.filter(function (v) { return marcados[v]; }).length;
    todo.checked = vs.length > 0 && n === vs.length; todo.indeterminate = n > 0 && n < vs.length;
  }
  todo.onchange = function () { visibles().forEach(function (v) { marcados[v] = todo.checked; }); pintar(); };
  q.oninput = pintar;
  q.onkeydown = function (e) { if (e.key === 'Enter') m.querySelector('[data-aplicar]').click(); };
  m.querySelectorAll('.fm-ord').forEach(function (b) { b.onclick = function () { st.col = i; st.dir = Number(b.dataset.d); cerrarMenuFiltro(); aplicarTabla(tabla); }; });
  m.querySelector('[data-limpiar]').onclick = function () { delete st.f[i]; cerrarMenuFiltro(); aplicarTabla(tabla); };
  m.querySelector('[data-aplicar]').onclick = function () {
    // con búsqueda escrita, se aplican solo los valores marcados que coinciden con la búsqueda (como Excel)
    var base = q.value.trim() ? visibles() : lista;
    var sel = base.filter(function (v) { return marcados[v]; });
    if (sel.length === lista.length) delete st.f[i]; else st.f[i] = sel;
    cerrarMenuFiltro(); aplicarTabla(tabla);
  };
  pintar();

  // posición: bajo el botón, sin salirse de la pantalla
  var r = boton.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  var top = r.bottom + 6;
  if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  m.style.left = (left + window.scrollX) + 'px'; m.style.top = (top + window.scrollY) + 'px';
  setTimeout(function () { q.focus(); }, 0);
  document.addEventListener('mousedown', clicFueraMenu, true);
  document.addEventListener('keydown', escMenu, true);
}

function aplicarTabla(tabla) {
  var tbody = tabla.tBodies[0], st = tabla._st;
  tabla._aplicando = true;
  try {
    var filas = filasDatos(tbody);
    var visibles = 0;
    filas.forEach(function (tr) { var ok = pasaFiltros(tr, st.f); tr.hidden = !ok; if (ok) visibles++; });
    Array.prototype.forEach.call(tabla.tHead.rows[0].cells, function (th, i) {
      var fl = th.querySelector('.flecha'), fb = th.querySelector('.fbtn'); if (!fl) return;
      if (st.col === i) { fl.textContent = st.dir > 0 ? '▲' : '▼'; th.dataset.dir = st.dir; } else { fl.textContent = ''; delete th.dataset.dir; }
      if (fb) fb.classList.toggle('on', !!st.f[i]);
    });
    if (st.col != null) {
      filas.map(function (tr, k) { return { tr: tr, v: valorOrden(textoCelda(tr.cells[st.col])), k: k }; })
        .sort(function (a, b) {
          if (a.v === null && b.v === null) return a.k - b.k;
          if (a.v === null) return 1; if (b.v === null) return -1;
          var r = (typeof a.v === 'number' && typeof b.v === 'number') ? a.v - b.v : String(a.v).localeCompare(String(b.v), 'es', { numeric: true });
          return r * st.dir || a.k - b.k;
        })
        .forEach(function (x) { tbody.appendChild(x.tr); });
    }
    var activos = Object.keys(st.f).filter(function (i) { return st.f[i]; });
    var info = tabla._info;
    if (info) {
      info.hidden = !activos.length;
      if (activos.length) {
        var ths = tabla.tHead.rows[0].cells;
        info.innerHTML = 'Mostrando ' + visibles + ' de ' + filas.length + ' filas · filtro en ' +
          activos.map(function (i) { return '<b>' + esc(ths[i].textContent.replace(/[▲▼]/g, '').trim()) + '</b>'; }).join(', ') +
          ' <button type="button">Quitar filtros</button>';
        info.querySelector('button').onclick = function () { st.f = {}; aplicarTabla(tabla); };
      }
    }
  } finally {
    setTimeout(function () { tabla._aplicando = false; }, 0);
  }
}

function mejorarTablas(raiz) {
  Array.prototype.forEach.call((raiz || document).querySelectorAll('table'), function (t) { if (!t._listo) mejorarTabla(t); });
}
(function () {
  var pend = false;
  var obs = new MutationObserver(function () {
    if (pend) return; pend = true;
    requestAnimationFrame(function () { pend = false; mejorarTablas(document.getElementById('main')); mejorarTablas(document.getElementById('modal-root')); });
  });
  obs.observe(document.getElementById('main'), { childList: true, subtree: true });
  obs.observe(document.getElementById('modal-root'), { childList: true, subtree: true });
})();

});
