<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kr-900:#17142e; --kr-800:#211d42; --kr-700:#2e2862; --kr-600:#3f3a8f; --kr-500:#5b57c9; --kr-400:#7d7ae0; --kr-300:#a9a7ef; --kr-100:#e9e8fb; --kr-50:#f4f4fd;
  --ink:#1b1a24; --ink-2:#4a4859; --ink-3:#7b7990; --line:#e6e5ef; --bg:#f6f6fa; --card:#fff;
  --ok:#14804a; --ok-bg:#e3f5ea; --warn:#a15c00; --warn-bg:#fff2dc; --bad:#b4232c; --bad-bg:#fde7e8; --info:#2459b8; --info-bg:#e5eefc; --mute-bg:#efeff4;
  --r:14px; --shadow:0 1px 2px rgba(23,20,46,.06),0 4px 16px rgba(23,20,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:26px;font-weight:700} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
a{color:var(--kr-600)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:232px;flex:0 0 232px;background:linear-gradient(180deg,var(--kr-900),var(--kr-800));color:#d9d8f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:Outfit,Inter,system-ui,sans-serif;font-size:19px;color:#fff;letter-spacing:.06em;display:block;line-height:1}
.brand small{font-size:11px;color:var(--kr-300);letter-spacing:.04em}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#cfcdf0;text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--kr-600);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.nav .badge{margin-left:auto;background:#ff6b6b;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--kr-300)}

/* ---------- Main ---------- */
main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top .sub{color:var(--ink-3);margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mobilebar{display:none}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.pad0{padding:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card.pad0 .hd{padding:16px 18px 0}
.kpi .lbl{color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-family:Outfit,Inter,system-ui,sans-serif;font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.kpi.hero{background:linear-gradient(135deg,var(--kr-700),var(--kr-500));color:#fff;border:0}
.kpi.hero .lbl,.kpi.hero .foot{color:#d7d6fb}
.bar{height:8px;background:var(--kr-100);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--kr-500);border-radius:99px}
.kpi.hero .bar{background:rgba(255,255,255,.2)} .kpi.hero .bar>i{background:#fff}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfbfe;white-space:nowrap}
thead{position:sticky;top:0;z-index:2}
th.ord{cursor:pointer;user-select:none}
th.ord:hover{color:var(--kr-600)}
th.ord .flecha{display:inline-block;width:12px;margin-left:3px;color:var(--kr-500);font-size:10px}
th.ord[data-dir] {color:var(--kr-600)}
.fbtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink-3);cursor:pointer;vertical-align:-4px}
.fbtn svg{width:12px;height:12px}
.fbtn:hover{border-color:var(--kr-400);color:var(--kr-600)}
.fbtn.on{background:var(--kr-500);border-color:var(--kr-500);color:#fff}
.fmenu{position:absolute;z-index:90;width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(23,20,46,.18);padding:8px;display:flex;flex-direction:column;gap:4px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);animation:pop .12s}
.fmenu .fm-ord{text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink)}
.fmenu .fm-ord:hover{background:var(--kr-50);color:var(--kr-600)}
.fmenu .fm-sep{height:1px;background:var(--line);margin:4px 0}
.fmenu .fm-q{width:100%;padding:7px 10px;font-size:13px}
.fmenu label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.fmenu label:hover{background:var(--kr-50)}
.fmenu input[type=checkbox]{width:16px;height:16px;accent-color:var(--kr-500);flex:none;margin:0}
.fmenu .fm-all{margin-top:4px}
.fmenu .fm-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.fmenu .fm-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmenu .fm-pie{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
tr.filtros th{padding:6px 8px;text-transform:none;letter-spacing:0;font-weight:500;background:#f7f7fc}
tr.filtros .in{width:100%;min-width:70px;padding:4px 8px;font-size:12px;border-radius:7px}
tr.filtros .in.activo{border-color:var(--kr-400);background:var(--kr-50)}
.tbl-info{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line)}
.tbl-info button{border:0;background:none;color:var(--kr-600);font-weight:600;cursor:pointer;font-size:12px;padding:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--kr-50)}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
.nowrap{white-space:nowrap}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.kr{background:var(--kr-100);color:var(--kr-600)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--kr-300);background:var(--kr-50)}
.btn.pri{background:var(--kr-600);border-color:var(--kr-600);color:#fff} .btn.pri:hover{background:var(--kr-700)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--kr-50)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;min-width:0;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--kr-400);box-shadow:0 0 0 3px var(--kr-100)}
.search{position:relative} .search input{padding-left:34px;width:240px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--mute-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--kr-600);box-shadow:var(--shadow)}

/* ---------- Form ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px;font-weight:600;color:var(--ink-2)}
.form .sect{grid-column:1/-1;font-family:Outfit,Inter,system-ui,sans-serif;font-weight:600;color:var(--kr-600);margin-top:6px;border-top:1px solid var(--line);padding-top:12px}

/* ---------- Modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(23,20,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{max-width:900px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:18px 20px;max-height:70vh;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fbfbfe;border-radius:0 0 18px 18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(8px);opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--kr-900);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:80;font-weight:500;max-width:90vw}
.toast.err{background:var(--bad)}

/* ---------- Misc ---------- */
.empty{text-align:center;color:var(--ink-3);padding:34px 16px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);padding:60px}
.spin{width:22px;height:22px;border:3px solid var(--kr-100);border-top-color:var(--kr-500);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--kr-100);color:var(--kr-600);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:160px;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;max-width:14px;border-radius:4px 4px 0 0}
.chart .bars i.a{background:var(--kr-500)} .chart .bars i.b{background:var(--kr-300)}
.chart .c span{font-size:10.5px;color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.att{display:inline-flex;gap:4px}
.att button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.att button.on.P{background:var(--ok);border-color:var(--ok);color:#fff}
.att button.on.J{background:var(--info);border-color:var(--info);color:#fff}
.att button.on.I{background:var(--bad);border-color:var(--bad);color:#fff}
.att button.on.A{background:#8a879c;border-color:#8a879c;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--kr-600);border-color:var(--kr-500)}
.note{background:var(--kr-50);border:1px solid var(--kr-100);border-radius:12px;padding:12px 14px;color:var(--ink-2)}
.note.warn{background:var(--warn-bg);border-color:#f3dcb0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.score{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:700;font-size:16px}
.hidem{}
.grid>*{min-width:0}
.who{flex:1}
main{overflow-x:hidden}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .side{position:fixed;left:-250px;z-index:60;transition:left .2s;height:100vh}
  .side.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .mobilebar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:var(--kr-900);color:#fff;padding:10px 16px}
  .mobilebar b{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:.06em}
  .mobilebar button{background:none;border:0;color:#fff;padding:4px;cursor:pointer}
  main{padding:18px 16px 60px}
  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .g4 .kpi{padding:14px}
  .kpi .val{font-size:21px}
  .kpi .foot{font-size:11.5px}
  .form{grid-template-columns:1fr}
  .search input{width:100%}
  .search{flex:1}
  h1{font-size:22px}
  .hidem{display:none}
  .modal{border-radius:16px}
  .li{flex-wrap:wrap}
  .li .row{margin-left:auto}
  .top .toolbar{width:100%}
  .card.pad0 .row .seg{order:3}
}
</style>
